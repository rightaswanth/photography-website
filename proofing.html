<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Proofing Gallery | Robin Reverie</title>

    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/proofing.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="container header__content">
            <a href="index.html" class="header__logo" aria-label="Robin Reverie Home">
                <svg width="32" height="32" viewBox="0 0 100 100" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 80 L50 20 L80 80 L50 50 Z" stroke="currentColor" stroke-width="5"/>
                </svg>
                <span class="logo__text">Robin Reverie</span>
            </a>
            <p style="font-size: var(--font-size-small); text-transform: uppercase;">Client Area</p>
        </div>
    </header>

    <main id="main-content">
        <div class="container">

            <section id="password-form-view" class="password-form-container" aria-labelledby="login-heading">
                <form id="password-form" class="password-form">
                    <h1 id="login-heading">Client Login</h1>
                    <p>Enter the private password provided for your gallery.</p>
                    <div class="form-group">
                        <label for="gallery-password">Password</label>
                        <input type="password" id="gallery-password" name="gallery-password" required autocomplete="off">
                    </div>
                    <button type="submit" class="button button--primary">Access Gallery</button>
                    <p id="password-error" class="password-error" role="alert" aria-live="assertive" style="display: none;">Incorrect password. Please try again.</p>
                </form>
            </section>

            <section id="proofing-gallery-view" aria-labelledby="gallery-h1">
                <header class="proofing-header">
                    <h1 id="gallery-h1" class="section-title" style="margin: 0; font-size: 2rem;">The Smith Wedding Proofs (72 Images)</h1>
                    <div class="proofing-tools">
                        <p>Favorites: <span id="favorites-count" class="favorites-count">0</span></p>
                        <button class="button button--secondary" id="compare-favorites-btn" disabled>Compare (0)</button>
                        <button class="button button--primary" id="download-selected-btn" disabled>Download Selected (0)</button>
                    </div>
                </header>

                <div class="proofing-grid" id="proofing-grid">
                    </div>

                <div class="text-center mt-xl">
                    <button class="button button--secondary" id="logout-button">Log Out</button>
                </div>
            </section>

        </div>
    </main>

    <footer class="footer">
        <div class="container" style="text-align: center; color: var(--color-bg-light); padding: 1rem;">
             &copy; <span id="current-year">2024</span> Robin Reverie. | <a href="privacy.html" style="color: var(--color-text-secondary);">Privacy</a> | <a href="terms.html" style="color: var(--color-text-secondary);">Terms</a>
        </div>
    </footer>

    <script src="/js/main.js" defer></script>
    <script src="/js/proofing.js" defer></script>
</body>
</html>
